<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Media Query</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: aqua;
        }
        @media screen and (orientation:portrait){
            body{
                border: 2px solid darkmagenta;
            }
        }
        @media screen and (max-width:455px){
            body{
                background-color: rgb(16, 16, 75);
                color:whitesmoke;
            }
            .boxes{
                flex-direction: column;
            }
        }
        .box{
            background-color: rgb(160, 123, 194);
            height: 344px;
            width: 344px;
            padding: 3px;
            margin: 3px;
        }
        .boxes{
            display: flex;
        }
    </style>
</head>
<body>
    <div>
        It is a box
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
