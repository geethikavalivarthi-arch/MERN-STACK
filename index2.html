<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap');
        h1{
            font-family:'Baloo Bhai 2', cursive;
        }    
        p{
            font-size:20px;
            font-style:italic;
            font-weight:700;
        }
        h2{
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: aqua;
            text-decoration-thickness: 3px;
            text-indent: 50px;
        }
        .lorem{
            border: 2px solid pink;
            width:70px;
            /* word-break: break-all; */
            text-overflow: ellipsis;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div>
    <h1>Fonts</h1>
    <h2>About Fonts</h2>
    <p>This is a paragraph.</p>
    <p class="lorem">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Doloremque distinctio nam voluptates eius, sit explicabo id dignissimos soluta. Porro, eius sequi eligendi laudantium quo possimus.   
    </p>
    </div>
</body>
</html>
