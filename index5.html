<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More About CSS Selector</title>
    <style>
        .box:first-child{
            background-color: aquamarine;
        }
        .boxes *{
            color: blueviolet;
            border: 2px solid rgb(228, 147, 147)
        }
        .box::first-line{
            color: rgb(92, 92, 184);
        }
        .boxes::before{
            content:" Hey Hi";
            color: rgb(207, 132, 40);
        }
        .boxes::after{
            content: "Nice Name";
            color: darkolivegreen;
        }
        .box::first-letter{
            color: rgb(16, 143, 100);
            font-size: 40px;
        }
        input::placeholder{
            color: rgb(206, 8, 41);
        }
        ::selection{
            background-color: blueviolet;
            color: blue;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box"> I am First Box</div>
        <div class="box"> I am Second Box</div>
        <div class="box">I am Third Box</div>
        <input type="text" placeholder="Enter your name">
    </div>
</body>
</html>
